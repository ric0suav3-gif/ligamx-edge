<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#0b1210;--surface:#121b18;--surface2:#18241f;--line:#22322b;--text:#e8efe9;--muted:#8fa39a;--amber:#f5b53f;--amber-dim:#8a6a2a;--home:#7fd1a8;--away:#9db4e8;--green:#4ade80;--red:#f87171;--blue:#77a7ff;--radius:14px;font-size:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;min-height:100vh;padding-bottom:90px}.cond{font-family:'Barlow Condensed',system-ui,sans-serif}button,select{font:inherit}
header{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;display:flex;align-items:baseline;justify-content:space-between}header h1{font-family:'Barlow Condensed';font-weight:700;font-size:1.5rem;letter-spacing:.04em;text-transform:uppercase}header h1 span{color:var(--amber)}#dataDate{font-size:.72rem;color:var(--muted);text-align:right}.apiTag{font-size:.58rem;color:var(--home);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.warn{margin:0 12px 10px;background:rgba(245,181,63,.12);border:1px solid var(--amber-dim);border-radius:12px;padding:9px 12px;font-size:.76rem;color:var(--amber);line-height:1.4}.warn.low{color:#ffd28b}.warn.good{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.3);color:#9ff0b5}
.board{margin:6px 12px 12px;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px}.fixtureSel{width:100%;appearance:none;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px 10px;font-family:'Barlow Condensed';font-weight:600;font-size:1.02rem;letter-spacing:.02em;text-align:center;border-bottom:3px solid var(--amber-dim)}.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:10px}.teamName{text-align:center;font-family:'Barlow Condensed';font-weight:700;font-size:1.08rem}.teamName.home{color:var(--home)}.teamName.away{color:var(--away)}.vsMark{font-family:'Barlow Condensed';font-weight:700;color:var(--muted);font-size:1rem}.venueNote{margin-top:7px;text-align:center;font-size:.68rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.tabs{display:flex;gap:6px;margin:0 12px 10px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;min-width:79px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:10px 10px;font-family:'Barlow Condensed';font-weight:600;font-size:.9rem;letter-spacing:.05em;text-transform:uppercase}.tab.on{background:var(--amber);color:#1a1408;border-color:var(--amber)}
#markets,#regView,#dataView{padding:0 12px;display:flex;flex-direction:column;gap:10px}.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}.tHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}.tName{font-family:'Barlow Condensed';font-weight:600;font-size:1.05rem;letter-spacing:.03em;text-transform:uppercase}.tLam{font-size:.72rem;color:var(--muted);line-height:1.4}.tLam b{color:var(--text);font-weight:600}.rel{display:inline-block;border-radius:999px;padding:2px 6px;font-size:.54rem;font-weight:700;margin-left:5px}.rel.HIGH{color:#9ff0b5;background:rgba(74,222,128,.1)}.rel.MEDIUM{color:#c6d7ff;background:rgba(119,167,255,.1)}.rel.LOW,.rel.UNKNOWN{color:#ffd28b;background:rgba(245,181,63,.1)}
.lineRow{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:stretch}.stepper{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}.stepper button{background:none;border:none;color:var(--amber);font-size:1.25rem;width:34px;height:100%;font-weight:600}.stepper .val{min-width:44px;text-align:center;font-family:'Barlow Condensed';font-weight:700;font-size:1.18rem}.odd{border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:6px 4px;text-align:center;position:relative;cursor:pointer}.odd .lab{font-size:.62rem;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}.odd .px{font-family:'Barlow Condensed';font-weight:700;font-size:1.35rem;line-height:1.15}.odd .pc{font-size:.61rem;color:var(--muted);line-height:1.25}.odd.fav .px{color:var(--amber)}.odd.value{border-color:rgba(74,222,128,.45)}.odd.value:after{content:'VALOR';position:absolute;right:4px;top:3px;font-size:.43rem;color:var(--green);font-weight:700}.bookline{margin-top:6px;padding:6px 7px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-size:.6rem;color:var(--muted);line-height:1.35}.bookline b{color:var(--text)}.edgePos{color:var(--green);font-weight:600}.edgeNeg{color:var(--red);font-weight:600}
.h3col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:4px}.h2col{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}.big{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.big .lab{font-size:.59rem;color:var(--muted);text-transform:uppercase}.big .px{font-family:'Barlow Condensed';font-weight:700;font-size:1.3rem}.big .pc{font-size:.6rem;color:var(--muted)}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:11px}.pick.value{border-color:rgba(74,222,128,.45)}.picktop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.pickname{font-size:.84rem;font-weight:600;line-height:1.35}.ev{font-family:'Barlow Condensed';font-weight:700;font-size:1.05rem;white-space:nowrap}.ev.pos{color:var(--green)}.ev.neg{color:var(--red)}.pickmeta{font-size:.66rem;color:var(--muted);line-height:1.45;margin-top:5px}.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.pbox{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px;text-align:center}.pbox .k{font-size:.5rem;color:var(--muted);text-transform:uppercase}.pbox .v{font-family:'Barlow Condensed';font-size:.95rem;font-weight:700;margin-top:2px}.btn{background:var(--amber);color:#1a1408;border:none;border-radius:10px;padding:11px;font-family:'Barlow Condensed';font-weight:700;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase}.btn.ghost{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}.mini{padding:6px 9px;font-size:.72rem}.note{margin:12px 12px 0;font-size:.68rem;color:var(--muted);line-height:1.5;text-align:center}.empty{border:1px dashed var(--line);border-radius:12px;padding:15px;color:var(--muted);font-size:.76rem;line-height:1.5;text-align:center}.sectionTitle{font-family:'Barlow Condensed';font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--amber);margin-bottom:5px}.coverage{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.cov{font-size:.57rem;border:1px solid var(--line);border-radius:999px;padding:3px 6px;color:var(--muted)}.cov.low{color:#ffd28b;border-color:var(--amber-dim)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(11,18,16,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 8px);z-index:30}nav button{flex:1;background:none;border:none;color:var(--muted);font-family:'Barlow Condensed';font-weight:600;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;padding:8px 0}nav button.on{color:var(--amber)}
@media(min-width:700px){body{max-width:650px;margin:0 auto}nav{left:50%;right:auto;width:650px;transform:translateX(-50%)}}
</style>
</head>
<body>
<header><h1>UCL <span>EDGE</span></h1><div><div id="dataDate"></div><div class="apiTag">API-Football · build snapshot</div></div></header>
<div id="mainView">
  <div class="board"><select id="fixtureSel" class="fixtureSel"></select><div class="vs"><div id="homeName" class="teamName home"></div><div class="vsMark">VS</div><div id="awayName" class="teamName away"></div></div><div class="venueNote">modelo UCL · local / visitante</div></div>
  <div class="tabs"><button class="tab on" data-mode="total">Totales</button><button class="tab" data-mode="team">Por equipo</button><button class="tab" data-mode="h2h">H2H</button><button class="tab" data-mode="ah">AH</button><button class="tab" data-mode="picks">Picks</button></div>
  <div id="warn"></div><div id="markets"></div><p class="note">Cuotas justas sin margen. Toca una cuota para guardarla en Registro. El valor existe cuando la casa paga por encima de la justa del modelo. Los mercados LOW/proxy se muestran, pero con advertencia.</p>
</div>
<div id="regView" style="display:none"></div>
<div id="dataView" style="display:none"></div>
<nav><button id="navMain" class="on" onclick="showView('main')">Mercados</button><button id="navReg" onclick="showView('reg')">Registro</button><button id="navData" onclick="showView('data')">Datos</button></nav>
<script>
const D=__UCL_DATA__;
const LABEL=D.stat_labels;
let fi=0,mode='total';
const state={total:{},home:{},away:{},ah:{}};
const $=id=>document.getElementById(id);
const F=()=>D.fixtures[fi];
const fmt=x=>Number.isInteger(+x)?String(+x):(+x).toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
const fairFmt=x=>x&&isFinite(x)?x.toFixed(2):'—';
const pct=x=>`${(x*100).toFixed(0)}%`;
const signed=x=>`${x>=0?'+':''}${(x*100).toFixed(1)}%`;
function splitLine(L){const q=Math.round(L*4);return Math.abs(q)%2===1?[[L-.25,.5],[L+.25,.5]]:[[L,1]];}
function conv(a,b){const o=Array(a.length+b.length-1).fill(0);for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)o[i+j]+=a[i]*b[j];return o;}
function margin(a,b){const n=Math.max(a.length,b.length),off=n-1,o=Array(2*n-1).fill(0);for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)o[i-j+off]+=a[i]*b[j];const s=o.reduce((x,y)=>x+y,0);return {d:o.map(x=>x/s),off};}
function asianDist(dist,L,side){let w=0,p=0,l=0;for(let k=0;k<dist.length;k++)for(const [c,wt] of splitLine(L)){let d=k-c;if(side==='under')d=-d;if(d>1e-9)w+=dist[k]*wt;else if(d<-1e-9)l+=dist[k]*wt;else p+=dist[k]*wt;}return {w,p,l,fair:w>1e-12?1+l/w:null};}
function ahDist(a,b,L){const m=margin(a,b);let w=0,p=0,l=0;for(let i=0;i<m.d.length;i++){const raw=i-m.off;for(const [c,wt] of splitLine(L)){const z=raw+c;if(z>1e-9)w+=m.d[i]*wt;else if(z<-1e-9)l+=m.d[i]*wt;else p+=m.d[i]*wt;}}return {w,p,l,fair:w>1e-12?1+l/w:null};}
function h2hDist(a,b){const m=margin(a,b);let h=0,t=0,aw=0;for(let i=0;i<m.d.length;i++){const z=i-m.off;if(z>0)h+=m.d[i];else if(z<0)aw+=m.d[i];else t+=m.d[i];}return {h,t,a:aw,hf:h>0?(1-t)/h:null,af:aw>0?(1-t)/aw:null};}
function qkey(stat,kind,sel,line){return [stat,kind,sel,line==null?'':fmt(line)].join('|');}
function getQuote(stat,kind,sel,line){return F().odds[qkey(stat,kind,sel,line)]||null;}
function evAt(q,m,priceKey='best'){if(!q||!m||!q[priceKey])return null;return m.w*(q[priceKey]-1)-m.l;}
function relBadge(s){return `<span class="rel ${s.reliability}">${s.reliability}${s.source==='ONE_SIDED_FALLBACK'?' · PROXY':''}</span>`;}
function stepper(bucket,key,val,step){return `<div class="stepper"><button onclick="move('${bucket}','${key}',-${step})">−</button><div class="val">${fmt(val)}</div><button onclick="move('${bucket}','${key}',${step})">＋</button></div>`;}
function move(bucket,key,d){state[bucket][key]=Math.max(0,+(state[bucket][key]+d).toFixed(2));render();}
function bookLine(q,m){if(!q)return '<div class="bookline">Sin línea exacta en el snapshot API para este número.</div>';const e=evAt(q,m,'best');const cls=e!=null&&e>0?'edgePos':'edgeNeg';return `<div class="bookline">API: mediana <b>${q.median.toFixed(2)}</b> · mejor <b>${q.best.toFixed(2)} ${q.best_book}</b> · ${q.books} book${q.books===1?'':'s'} · <span class="${cls}">${e==null?'—':signed(e)} EV mejor</span></div>`;}
function oddBox(label,m,q,stat,kind,sel,line){const e=evAt(q,m,'best');const cls=e!=null&&e>0?'value':'';return `<div class="odd ${cls}" onclick="saveMarket('${stat}','${kind}','${sel}',${line==null?'null':line},${m.fair||0},${m.w||0})"><div class="lab">${label}</div><div class="px">${fairFmt(m.fair)}</div><div class="pc">${pct(m.w)}${m.p>.005?` · push ${pct(m.p)}`:''}</div></div>`;}
function defaultLine(k,mean,bucket,step=.5){if(state[bucket][k]==null)state[bucket][k]=Math.max(step,Math.round(mean/step)*step);return state[bucket][k];}
function ticketHead(stat,s){return `<div class="tHead"><div class="tName">${LABEL[stat]}</div><div class="tLam">esp: <b>${s.home_mean.toFixed(2)}</b> vs <b>${s.away_mean.toFixed(2)}</b>${relBadge(s)}</div></div>`;}
function totalMarkets(){let html='';for(const [stat,s] of Object.entries(F().stats)){const d=conv(s.home_dist,s.away_dist),k='t_'+stat,L=defaultLine(k,s.home_mean+s.away_mean,'total');const o=asianDist(d,L,'over'),u=asianDist(d,L,'under'),qo=getQuote(stat,'match_total','over',L),qu=getQuote(stat,'match_total','under',L);html+=`<div class="ticket">${ticketHead(stat,s)}<div class="lineRow">${stepper('total',k,L,.5)}${oddBox('Más',o,qo,stat,'match_total','over',L)}${oddBox('Menos',u,qu,stat,'match_total','under',L)}</div>${bookLine(qo||qu,qo?o:u)}</div>`;}return html||'<div class="empty">Sin proyecciones.</div>';}
function teamMarkets(){let html='';for(const [stat,s] of Object.entries(F().stats)){const hk='h_'+stat,ak='a_'+stat,HL=defaultLine(hk,s.home_mean,'home'),AL=defaultLine(ak,s.away_mean,'away');const ho=asianDist(s.home_dist,HL,'over'),hu=asianDist(s.home_dist,HL,'under'),ao=asianDist(s.away_dist,AL,'over'),au=asianDist(s.away_dist,AL,'under');const qho=getQuote(stat,'home_total','over',HL),qhu=getQuote(stat,'home_total','under',HL),qao=getQuote(stat,'away_total','over',AL),qau=getQuote(stat,'away_total','under',AL);html+=`<div class="ticket">${ticketHead(stat,s)}<div class="tLam" style="margin-bottom:5px"><b>${F().home}</b></div><div class="lineRow">${stepper('home',hk,HL,.5)}${oddBox('Más',ho,qho,stat,'home_total','over',HL)}${oddBox('Menos',hu,qhu,stat,'home_total','under',HL)}</div>${bookLine(qho||qhu,qho?ho:hu)}<div class="tLam" style="margin:10px 0 5px"><b>${F().away}</b></div><div class="lineRow">${stepper('away',ak,AL,.5)}${oddBox('Más',ao,qao,stat,'away_total','over',AL)}${oddBox('Menos',au,qau,stat,'away_total','under',AL)}</div>${bookLine(qao||qau,qao?ao:au)}</div>`;}return html;}
function h2hMarkets(){let html='';for(const [stat,s] of Object.entries(F().stats)){const m=h2hDist(s.home_dist,s.away_dist),hm={w:m.h,p:m.t,l:m.a,fair:m.hf},am={w:m.a,p:m.t,l:m.h,fair:m.af},qh=getQuote(stat,'h2h','home',null),qa=getQuote(stat,'h2h','away',null);html+=`<div class="ticket">${ticketHead(stat,s)}<div class="h2col">${oddBox(F().home,hm,qh,stat,'h2h','home',null)}${oddBox(F().away,am,qa,stat,'h2h','away',null)}</div><div class="tLam" style="margin-top:7px;text-align:center">Empate estadístico: ${(m.t*100).toFixed(1)}% · se trata como push para la justa H2H.</div>${bookLine(qh||qa,qh?hm:am)}</div>`;}return html;}
function ahMarkets(){let html='';for(const [stat,s] of Object.entries(F().stats)){const k='ah_'+stat;if(state.ah[k]==null)state.ah[k]=Math.round((-(s.home_mean-s.away_mean))*4)/4;const L=state.ah[k],hm=ahDist(s.home_dist,s.away_dist,L),am=ahDist(s.away_dist,s.home_dist,-L),qh=getQuote(stat,'handicap','home',L),qa=getQuote(stat,'handicap','away',-L);html+=`<div class="ticket">${ticketHead(stat,s)}<div class="lineRow">${stepper('ah',k,L,.25)}${oddBox(`${F().home} ${L>0?'+':''}${fmt(L)}`,hm,qh,stat,'handicap','home',L)}${oddBox(`${F().away} ${-L>0?'+':''}${fmt(-L)}`,am,qa,stat,'handicap','away',-L)}</div>${bookLine(qh||qa,qh?hm:am)}<div class="tLam" style="margin-top:6px">AH usa distribución conjunta con aproximación de independencia entre conteos de equipo. Líneas .25/.75 se liquidan mitad y mitad.</div></div>`;}return html;}
function marketText(p){const side=p.market_type==='home_total'?p.home:p.market_type==='away_total'?p.away:p.market_type==='match_total'?'Partido':p.selection==='home'?p.home:p.away;const sel=p.market_type==='handicap'?`${p.selection==='home'?p.home:p.away} ${p.line>=0?'+':''}${fmt(p.line)}`:p.market_type==='h2h'?`${side} H2H`:`${side} ${p.selection==='over'?'Más':'Menos'} ${fmt(p.line)}`;return `${LABEL[p.stat]} · ${sel}`;}
function picksMarkets(){const P=F().picks;if(!P.length)return '<div class="empty">No hay mercados de stats parseados en el snapshot actual. Los fair markets siguen disponibles en las otras pestañas.</div>';let html=`<div class="warn good">Ranking del partido: compara la cuota justa con la mediana y mejor precio del snapshot API. No se ocultan candidatos por un filtro de “Safe Mode”.</div>`;P.slice(0,8).forEach((p,i)=>{const pos=p.ev_median>0;html+=`<div class="pick ${pos?'value':''}"><div class="picktop"><div class="pickname">${i+1}. ${marketText(p)}</div><div class="ev ${pos?'pos':'neg'}">${signed(p.ev_median)}</div></div><div class="pickmeta">Esperado ${p.home_mean.toFixed(2)}–${p.away_mean.toFixed(2)} · ${p.reliability}${p.source==='ONE_SIDED_FALLBACK'?' · PROXY':''}</div><div class="prices"><div class="pbox"><div class="k">Justa</div><div class="v">${p.fair.toFixed(2)}</div></div><div class="pbox"><div class="k">Mediana</div><div class="v">${p.median.toFixed(2)}</div></div><div class="pbox"><div class="k">Mejor</div><div class="v">${p.best.toFixed(2)}</div></div></div><div class="pickmeta">${p.books} books · mejor ${p.best_book} · EV mejor ${signed(p.ev_best)}</div><button class="btn mini" style="margin-top:8px;width:100%" onclick='saveCandidate(${JSON.stringify(JSON.stringify(p))})'>＋ Guardar pick</button></div>`;});return html;}
function renderWarn(){const lows=Object.entries(F().stats).filter(([k,s])=>s.reliability==='LOW'||s.source==='ONE_SIDED_FALLBACK');if(!lows.length){$('warn').innerHTML='';return;}$('warn').innerHTML=`<div class="warn low">⚠ Datos limitados en ${lows.map(([k,s])=>LABEL[k]).join(', ')}. Se muestran como LOW/PROXY; no son ceros ni datos inventados.</div>`;}
function render(){const f=F();$('homeName').textContent=f.home;$('awayName').textContent=f.away;renderWarn();$('markets').innerHTML=mode==='total'?totalMarkets():mode==='team'?teamMarkets():mode==='h2h'?h2hMarkets():mode==='ah'?ahMarkets():picksMarkets();}
function setup(){document.title=`UCL Edge · ${D.meta.date}`;$('dataDate').textContent=D.meta.date;$('fixtureSel').innerHTML=D.fixtures.map((f,i)=>`<option value="${i}">${f.home} vs ${f.away}</option>`).join('');$('fixtureSel').onchange=e=>{fi=+e.target.value;state.total={};state.home={};state.away={};state.ah={};render();};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode;render();});render();}
function saveMarket(stat,kind,sel,line,fair,p){const q=getQuote(stat,kind,sel,line);const name=kind==='handicap'?`${LABEL[stat]} · ${(sel==='home'?F().home:F().away)} ${line>=0?'+':''}${fmt(line)}`:kind==='h2h'?`${LABEL[stat]} · ${(sel==='home'?F().home:F().away)} H2H`:`${LABEL[stat]} · ${kind==='home_total'?F().home:kind==='away_total'?F().away:'Partido'} ${sel==='over'?'Más':'Menos'} ${fmt(line)}`;savePick(name,fair,p,q?q.best:null,q?q.best_book:null);}
function saveCandidate(raw){const p=JSON.parse(raw);savePick(marketText(p),p.fair,Math.min(1,1/p.fair),p.best,p.best_book);}
function loadPicks(){try{return JSON.parse(localStorage.getItem('uclEdgePicks'))||[];}catch(e){return[];}}
function storePicks(P){localStorage.setItem('uclEdgePicks',JSON.stringify(P));}
function savePick(name,fair,p,bookDefault,bookName){let book=prompt(`Cuota de la casa para:\n${name}\n\nJusta del modelo: ${fair.toFixed(2)}`,bookDefault?bookDefault.toFixed(2):fair.toFixed(2));if(book===null)return;book=parseFloat(String(book).replace(',','.'))||fair;const P=loadPicks();P.unshift({d:new Date().toISOString().slice(0,10),match:`${F().home} vs ${F().away}`,name,fair:+fair.toFixed(2),p:+p.toFixed(3),book,bookName:bookName||'',st:'open'});storePicks(P);alert('Pick guardado ✓'+(book<fair?'\n⚠ La casa paga MENOS que la justa: sin valor.':''));}
function markPick(i,st){const P=loadPicks();if(P[i]){P[i].st=st;storePicks(P);renderReg();}}
function delPick(i){const P=loadPicks();P.splice(i,1);storePicks(P);renderReg();}
function officialTracker(){const t=D.tracker;if(!t||!t.overall_official)return '';const o=t.overall_official;const hr=o.hit_rate==null?'—':`${(o.hit_rate*100).toFixed(1)}%`;const roi=o.reference_roi==null?'—':`${(o.reference_roi*100).toFixed(1)}%`;return `<div class="ticket"><div class="tHead"><div class="tName">Registro oficial UCL Edge</div><div class="tLam">settlement API-Football</div></div><div class="h3col"><div class="big"><div class="lab">Acierto</div><div class="px">${hr}</div><div class="pc">${o.picks||0} cerrados</div></div><div class="big"><div class="lab">P&L ref</div><div class="px">${o.reference_pnl_units==null?'—':(o.reference_pnl_units>=0?'+':'')+o.reference_pnl_units.toFixed(2)}</div><div class="pc">unidades</div></div><div class="big"><div class="lab">ROI ref</div><div class="px">${roi}</div><div class="pc">snapshot</div></div></div></div>`;}
function renderReg(){const P=loadPicks(),closed=P.filter(x=>x.st==='win'||x.st==='loss'),wins=closed.filter(x=>x.st==='win'),profit=closed.reduce((s,x)=>s+(x.st==='win'?(x.book-1):-1),0),exp=closed.length?closed.reduce((s,x)=>s+x.p,0)/closed.length:0;let html=officialTracker()+`<div class="ticket"><div class="tHead"><div class="tName">Registro en este iPhone</div><div class="tLam">${closed.length} cerrados · ${P.length-closed.length} abiertos</div></div><div class="h3col"><div class="big"><div class="lab">Aciertos</div><div class="px">${wins.length}/${closed.length}</div><div class="pc">esp ${(exp*100).toFixed(0)}%</div></div><div class="big"><div class="lab">Unidades</div><div class="px">${profit>=0?'+':''}${profit.toFixed(2)}</div><div class="pc">1u/pick</div></div><div class="big"><div class="lab">ROI</div><div class="px">${closed.length?(100*profit/closed.length).toFixed(1):0}%</div><div class="pc">cerrados</div></div></div></div>`;if(!P.length)html+='<div class="empty">Toca cualquier cuota justa en Mercados para registrar una jugada.</div>';P.forEach((x,i)=>{const badge=x.st==='win'?'✅':x.st==='loss'?'❌':x.st==='void'?'⚪':'🕐',val=x.book>x.fair?'<span class="edgePos">+valor</span>':'<span class="edgeNeg">sin valor</span>';html+=`<div class="ticket"><div class="tHead"><div class="pickname">${badge} ${x.name}</div><div class="tLam">${x.d}</div></div><div class="tLam">${x.match} · justa <b>${x.fair.toFixed(2)}</b> · casa <b>${x.book.toFixed(2)}</b> ${val}</div>${x.st==='open'?`<div class="h3col" style="margin-top:8px"><button class="btn mini" onclick="markPick(${i},'win')">Ganó</button><button class="btn ghost mini" onclick="markPick(${i},'loss')">Perdió</button><button class="btn ghost mini" onclick="markPick(${i},'void')">Nula</button></div>`:`<button class="btn ghost mini" style="margin-top:8px" onclick="delPick(${i})">Borrar</button>`}</div>`;});$('regView').innerHTML=html;}
function renderData(){let html=`<div class="ticket"><div class="sectionTitle">Modelo</div><div class="tLam"><b>${D.meta.version}</b><br>${D.meta.method}<br><br>${D.meta.note}<br><br><b>Fuente:</b> ${D.meta.source}</div></div>`;for(const f of D.fixtures){html+=`<div class="ticket"><div class="tName">${f.home} vs ${f.away}</div><div class="coverage">${Object.entries(f.stats).map(([k,s])=>`<span class="cov ${(s.reliability==='LOW'||s.source==='ONE_SIDED_FALLBACK')?'low':''}">${LABEL[k]} · ${s.reliability}${s.source==='ONE_SIDED_FALLBACK'?' proxy':''}</span>`).join('')}</div></div>`;}$('dataView').innerHTML=html;}
function showView(v){$('mainView').style.display=v==='main'?'block':'none';$('regView').style.display=v==='reg'?'flex':'none';$('dataView').style.display=v==='data'?'flex':'none';$('navMain').classList.toggle('on',v==='main');$('navReg').classList.toggle('on',v==='reg');$('navData').classList.toggle('on',v==='data');if(v==='reg')renderReg();if(v==='data')renderData();window.scrollTo(0,0);}
setup();
</script>
</body>
</html>
