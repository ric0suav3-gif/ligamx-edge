const $=id=>document.getElementById(id);
const fmt=(x,n=2)=>Number(x).toFixed(n).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');
const signed=x=>`${x>=0?'+':''}${(100*x).toFixed(1)}%`;
const label={points:'Puntos',pass_attempts:'Intentos de pase',pass_completions:'Completos',passing_yards:'Yardas de pase',rush_attempts:'Acarreos',rushing_yards:'Yardas terrestres',sacks:'Capturas',turnovers:'Pérdidas'};
let mode='summary';
let pickMode='all';
function marketName(r){const side=r.scope==='match_total'?'Partido':r.scope==='home_total'?D.game.home:D.game.away;return `${side} · ${r.side==='over'?'Más':'Menos'} ${fmt(r.line,1)}`;}
function marketCard(r){const edge=r.consensus_ev>0;return `<div class="card ${edge?'edge':''}"><div class="cardHead"><div><div class="scope">${label[r.stat]||r.stat} · ${r.books} books</div><div class="market">${marketName(r)}</div></div><div class="ev ${edge?'positive':'negative'}">${signed(r.consensus_ev)}</div></div><div class="metrics"><div class="metric"><div class="label">Esperado</div><div class="value">${fmt(r.expected)}</div></div><div class="metric"><div class="label">Justa</div><div class="value">${fmt(r.fair)}</div></div><div class="metric"><div class="label">Mejor</div><div class="value">${fmt(r.best_odd)}</div></div></div><div class="meta">Mediana ${fmt(r.median_odd)} · mejor ${r.best_book} · EV mejor ${signed(r.best_ev)}</div><button class="save" onclick='savePick(${JSON.stringify(JSON.stringify({name:(label[r.stat]||r.stat)+" · "+marketName(r),fair:r.fair,price:r.best_odd,book:r.best_book}))})'>Guardar mercado</button></div>`;}
function propCard(r){const edge=r.model_ev>0;return `<div class="card ${edge?'edge':''}"><div class="cardHead"><div><div class="scope">${r.team||'Historial no resuelto'} · ${label[r.stat]||r.stat}</div><div class="market">${r.player} · ${r.side==='over'?'Más':'Menos'} ${fmt(r.line,1)}</div></div><div class="ev ${edge?'positive':'negative'}">${signed(r.model_ev)}</div></div><div class="metrics"><div class="metric"><div class="label">Esperado</div><div class="value">${fmt(r.expected)}</div></div><div class="metric"><div class="label">Justa</div><div class="value">${fmt(r.model_fair)}</div></div><div class="metric"><div class="label">Casa</div><div class="value">${fmt(r.book_odds)}</div></div></div><div class="meta">${r.bookmaker} · fiabilidad ${r.reliability} · precio de una sola casa</div><button class="save" onclick='savePick(${JSON.stringify(JSON.stringify({name:r.player+" · "+(label[r.stat]||r.stat)+" "+r.side+" "+r.line,fair:r.model_fair,price:r.book_odds,book:r.bookmaker}))})'>Guardar prop</button></div>`;}
function summary(){const totals=D.team_markets.filter(r=>r.scope==='match_total'&&r.consensus_ev>0).sort((a,b)=>b.books-a.books||b.consensus_ev-a.consensus_ev);const teams=D.team_markets.filter(r=>r.scope!=='match_total'&&r.consensus_ev>0).sort((a,b)=>b.consensus_ev-a.consensus_ev);const props=D.player_props.filter(r=>r.status==='PRICED'&&r.model_ev>0).sort((a,b)=>b.model_ev-a.model_ev);let h=`<div class="sectionTitle">Lectura del partido</div><div class="card"><div class="summaryGrid"><div class="summaryBox"><div class="label">Marcador</div><div class="value">${fmt(D.game.home_points,0)}–${fmt(D.game.away_points,0)}</div><div class="sub">${D.game.home}</div></div><div class="summaryBox"><div class="label">Total</div><div class="value lean">${fmt(D.game.total)}</div><div class="sub">puntos</div></div><div class="summaryBox"><div class="label">Ventaja</div><div class="value">${fmt(D.game.home_margin)}</div><div class="sub">${D.game.home}</div></div></div></div>`;
if(D.moneyline.length){h+=`<div class="sectionTitle">Moneyline aproximado</div>`+D.moneyline.map(m=>`<div class="card"><div class="cardHead"><div><div class="scope">${m.team}</div><div class="market">Casa ${fmt(m.book_odds)} · justa ${fmt(m.fair)}</div></div><div class="ev ${m.ev>0?'positive':'negative'}">${signed(m.ev)}</div></div><div class="meta">Probabilidad normal aproximada ${(100*m.win_prob).toFixed(1)}%. No es un módulo moneyline calibrado.</div></div>`).join('');}
if(totals[0])h+=`<div class="sectionTitle">Total principal por cobertura</div>${marketCard(totals[0])}`;
if(teams.length)h+=`<div class="sectionTitle">Totales por equipo</div>${teams.slice(0,2).map(marketCard).join('')}`;
if(props.length)h+=`<div class="sectionTitle">Props destacados</div>${props.slice(0,3).map(propCard).join('')}`;
return h;}
function render(){let rows='';if(mode==='summary')rows=summary();if(mode==='totals')rows=D.team_markets.filter(r=>r.scope==='match_total').map(marketCard).join('');if(mode==='teams')rows=D.team_markets.filter(r=>r.scope!=='match_total').map(marketCard).join('');if(mode==='props')rows=D.player_props.filter(r=>r.status==='PRICED').sort((a,b)=>b.model_ev-a.model_ev).map(propCard).join('');$('cards').innerHTML=rows||'<div class="empty">No hay mercados disponibles en este snapshot.</div>';}
function rankedPicks(){const team=D.team_markets.filter(r=>r.consensus_ev>0).map(r=>({kind:'market',row:r,ev:Number(r.consensus_ev),price:Number(r.best_odd)}));const props=D.player_props.filter(r=>r.status==='PRICED'&&r.model_ev>0).map(r=>({kind:'prop',row:r,ev:Number(r.model_ev),price:Number(r.book_odds)}));return team.concat(props).sort((a,b)=>b.ev-a.ev);}
function setPickMode(value){pickMode=value;renderPicks();}
function renderPicks(){const all=rankedPicks(),ladder=all.filter(x=>x.price>=1.60&&x.price<=1.80),shown=(pickMode==='ladder'?ladder:all).slice(0,12);let h=`<div class="card"><div class="sectionTitle">Picks con mayor edge</div><div class="summaryGrid"><div class="summaryBox"><div class="label">Positivos</div><div class="value">${all.length}</div></div><div class="summaryBox"><div class="label">Edge máximo</div><div class="value positive">${all.length?signed(all[0].ev):'—'}</div></div><div class="summaryBox"><div class="label">Ladder</div><div class="value ladderTag">${ladder.length}</div><div class="sub">1.60–1.80</div></div></div></div><div class="pickControls"><button class="pickFilter ${pickMode==='all'?'on':''}" onclick="setPickMode('all')">Mayor edge</button><button class="pickFilter ${pickMode==='ladder'?'on':''}" onclick="setPickMode('ladder')">Ladder 1.60–1.80</button></div>`;if(!shown.length)h+='<div class="empty">No hay picks positivos para este filtro.</div>';shown.forEach((x,i)=>{const ladderPrice=x.price>=1.60&&x.price<=1.80;h+=`<div class="pickWrap"><div class="pickRank"><b>#${i+1}</b><span class="${ladderPrice?'ladderTag':''}">${x.kind==='prop'?'Prop':'Mercado'}${ladderPrice?' · Ladder':''}</span></div>${x.kind==='prop'?propCard(x.row):marketCard(x.row)}</div>`;});$('picksView').innerHTML=h;}
function loadPicks(){try{return JSON.parse(localStorage.getItem('nflEdgePicksV1'))||[];}catch(e){return[];}}
function storePicks(p){localStorage.setItem('nflEdgePicksV1',JSON.stringify(p));}
function savePick(raw){const x=JSON.parse(raw);let price=prompt(`Cuota disponible para:\n${x.name}\n\nJusta del modelo: ${fmt(x.fair)}`,fmt(x.price));if(price===null)return;price=parseFloat(String(price).replace(',','.'));if(!isFinite(price)||price<=1)return alert('Cuota inválida');const p=loadPicks();p.unshift({date:D.meta.date,game:`${D.game.away} @ ${D.game.home}`,name:x.name,fair:x.fair,price,book:x.book||'',status:'open'});storePicks(p);alert('Mercado guardado ✓');}
function markPick(i,status){const p=loadPicks();if(p[i]){p[i].status=status;storePicks(p);renderTracker();}}
function deletePick(i){const p=loadPicks();p.splice(i,1);storePicks(p);renderTracker();}
function renderTracker(){const p=loadPicks(),closed=p.filter(x=>x.status==='win'||x.status==='loss'),wins=closed.filter(x=>x.status==='win'),profit=closed.reduce((s,x)=>s+(x.status==='win'?x.price-1:-1),0);let h=`<div class="card"><div class="sectionTitle">Registro en este iPhone</div><div class="summaryGrid"><div class="summaryBox"><div class="label">Aciertos</div><div class="value">${wins.length}/${closed.length}</div></div><div class="summaryBox"><div class="label">Unidades</div><div class="value ${profit>=0?'positive':'negative'}">${profit>=0?'+':''}${profit.toFixed(2)}</div></div><div class="summaryBox"><div class="label">Abiertos</div><div class="value">${p.length-closed.length}</div></div></div></div>`;if(!p.length)h+='<div class="empty">Guarda un mercado desde la pantalla Mercados.</div>';p.forEach((x,i)=>{const icon=x.status==='win'?'✓':x.status==='loss'?'×':x.status==='void'?'—':'•';h+=`<div class="card"><div class="cardHead"><div class="market">${icon} ${x.name}</div><div class="scope">${x.date}</div></div><div class="meta">${x.game} · justa ${fmt(x.fair)} · casa ${fmt(x.price)} ${x.book}</div>${x.status==='open'?`<div class="metrics"><button class="save" onclick="markPick(${i},'win')">Ganó</button><button class="save secondary" onclick="markPick(${i},'loss')">Perdió</button><button class="save secondary" onclick="markPick(${i},'void')">Nula</button></div>`:`<button class="save secondary" onclick="deletePick(${i})">Borrar</button>`}</div>`;});$('trackerView').innerHTML=h;}
function renderData(){const rows=D.stats.map(s=>`<div class="statRow"><div class="statName">${s.label}</div><div class="statVal">${fmt(s.away)}</div><div class="statVal">${fmt(s.home)}</div></div>`).join('');$('dataView').innerHTML=`<div class="card"><div class="sectionTitle">Proyecciones base</div><div class="statRow tableHead"><div>Métrica</div><div>${D.game.away}</div><div>${D.game.home}</div></div><div class="statRows">${rows}</div></div><div class="card"><div class="sectionTitle">Modelo y límites</div><div class="fine"><b>${D.meta.version}</b><br>${D.meta.method}<br><br><b>Historial:</b> ${D.meta.history_note}<br><b>Fuente:</b> ${D.meta.source}<br><br>${D.meta.note}</div></div>`;}
function showView(v){$('mainView').style.display=v==='main'?'block':'none';$('picksView').style.display=v==='picks'?'flex':'none';$('trackerView').style.display=v==='tracker'?'flex':'none';$('dataView').style.display=v==='data'?'flex':'none';$('navMain').classList.toggle('on',v==='main');$('navPicks').classList.toggle('on',v==='picks');$('navTracker').classList.toggle('on',v==='tracker');$('navData').classList.toggle('on',v==='data');if(v==='picks')renderPicks();if(v==='tracker')renderTracker();if(v==='data')renderData();scrollTo(0,0);}
$('dataDate').textContent=D.meta.date;$('awayName').textContent=D.game.away;$('homeName').textContent=D.game.home;$('awayPoints').textContent=fmt(D.game.away_points);$('homePoints').textContent=fmt(D.game.home_points);$('spread').textContent=`${D.game.home} +${fmt(D.game.home_margin)}`;$('total').textContent=`Total ${fmt(D.game.total)}`;$('gameMeta').textContent=`${D.meta.kickoff} · ${D.meta.venue} · ID ${D.meta.game_id}`;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode;render();scrollTo(0,0)});render();
</script>
</body>
