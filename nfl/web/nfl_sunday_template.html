<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07111f">
<title>NFL Edge · Sunday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07111f;--surface:#0d1a2b;--surface2:#13243a;--line:#203753;--text:#f2f6fb;--muted:#91a4bb;--red:#ff4352;--blue:#55a4ff;--green:#46df91;--amber:#ffc857;--radius:16px;font-size:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{background:radial-gradient(circle at 50% -10%,#163253 0,var(--bg) 34%);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;min-height:100vh;padding-bottom:92px}button{font:inherit}header{padding:calc(env(safe-area-inset-top,0px) + 15px) 16px 10px;display:flex;align-items:center;justify-content:space-between}h1,.cond{font-family:'Barlow Condensed',system-ui,sans-serif}h1{font-size:1.55rem;letter-spacing:.055em;text-transform:uppercase}h1 span{color:var(--red)}.stamp{text-align:right;font-size:.66rem;color:var(--muted);line-height:1.4}.api{color:#91caff;text-transform:uppercase;font-size:.55rem;letter-spacing:.06em}
.hero{margin:4px 12px 10px;padding:16px 13px;background:linear-gradient(145deg,#173354,#0c1929);border:1px solid var(--line);border-radius:var(--radius)}.eyebrow,.scope{font-size:.56rem;text-transform:uppercase;letter-spacing:.075em;color:var(--muted)}.hero h2{font-family:'Barlow Condensed';font-size:1.55rem;margin-top:3px}.hero p{font-size:.68rem;line-height:1.5;color:var(--muted);margin-top:6px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.box{background:rgba(7,17,31,.65);border:1px solid var(--line);border-radius:11px;padding:8px 5px;text-align:center}.box span{display:block;font-size:.48rem;color:var(--muted);text-transform:uppercase}.box b{font-family:'Barlow Condensed';font-size:1.2rem}.green{color:var(--green)}.amber{color:var(--amber)}.red{color:#ff8088}
.tabs{display:flex;gap:6px;margin:0 12px 10px;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:1;min-width:72px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:10px 8px;font-family:'Barlow Condensed';font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}.tab.on{background:var(--red);border-color:var(--red);color:white}.view{display:none;padding:0 12px;flex-direction:column;gap:10px}.view.on{display:flex}.section{font-family:'Barlow Condensed';color:var(--blue);font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin:2px 2px -3px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}.card.pick{border-color:rgba(70,223,145,.45)}.head{display:flex;justify-content:space-between;gap:10px}.market{font-size:.87rem;font-weight:600;line-height:1.35;margin-top:3px}.rank{font-family:'Barlow Condensed';font-size:1.18rem;color:var(--green);white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.metric{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 5px;text-align:center}.metric span{display:block;font-size:.48rem;color:var(--muted);text-transform:uppercase}.metric b{font-family:'Barlow Condensed';font-size:1.05rem}.meta{font-size:.61rem;color:var(--muted);line-height:1.5;margin-top:7px}.badge{display:inline-block;padding:2px 7px;border-radius:999px;background:rgba(70,223,145,.1);color:#a0f4c3;font-size:.53rem;font-weight:700}.leg{padding:8px 0;border-bottom:1px solid var(--line)}.leg:last-child{border:0}.leg b{font-size:.78rem}.projection{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}.team{font-family:'Barlow Condensed';font-weight:700;font-size:.9rem}.score{font-family:'Barlow Condensed';font-weight:800;font-size:1.24rem;color:var(--amber)}.grade{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:.72rem}.grade:last-child{border:0}.note{font-size:.68rem;line-height:1.55;color:var(--muted)}.empty{border:1px dashed var(--line);border-radius:13px;padding:18px;color:var(--muted);font-size:.72rem;line-height:1.55;text-align:center}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(7,17,31,.96);backdrop-filter:blur(9px);border-top:1px solid var(--line);padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 8px);z-index:20}nav button{flex:1;border:0;background:none;color:var(--muted);font-family:'Barlow Condensed';font-weight:700;font-size:.82rem;text-transform:uppercase;padding:8px 0}nav button.on{color:var(--red)}@media(min-width:700px){body{max-width:650px;margin:auto}nav{left:50%;right:auto;width:650px;transform:translateX(-50%)}}
</style>
</head>
<body>
<header><h1>NFL <span>EDGE</span></h1><div class="stamp"><div id="date"></div><div class="api">API-NFL · Sunday</div></div></header>
<section class="hero"><div class="eyebrow">Week 1 · Sunday Card</div><h2>Straights first. Confidence first.</h2><p id="rules"></p><p id="screen" class="note"></p><div class="summary"><div class="box"><span>Partidos</span><b id="games"></b></div><div class="box"><span>Straights</span><b id="straightCount" class="green"></b></div><div class="box"><span>2-leg</span><b id="parlayCount" class="amber"></b></div></div></section>
<div class="tabs"><button class="tab on" data-view="card">Picks</button><button class="tab" data-view="parlays">2-Leg</button><button class="tab" data-view="slate">Slate</button><button class="tab" data-view="grade">Grade</button></div>
<main id="card" class="view on"></main><main id="parlays" class="view"></main><main id="slate" class="view"></main><main id="grade" class="view"></main>
<nav><button class="on" data-view="card">Picks</button><button data-view="parlays">2-Leg</button><button data-view="slate">Juegos</button><button data-view="grade">Pasado</button></nav>
<script>
const D=__NFL_SLATE_DATA__;
const $=id=>document.getElementById(id);const fmt=(x,n=2)=>Number(x).toFixed(n).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');const pct=x=>`${(100*Number(x)).toFixed(1)}%`;const edge=x=>`${x>=0?'+':''}${pct(x)}`;
function pickCard(r,i){return `<article class="card pick"><div class="head"><div><div class="scope">${r.away} @ ${r.home} · ${r.kickoff} ET</div><div class="market">${r.market}</div></div><div class="rank">#${i+1}</div></div><div class="metrics"><div class="metric"><span>Prob.</span><b class="green">${pct(r.probability)}</b></div><div class="metric"><span>Cuota</span><b>${fmt(r.median_odd)}</b></div><div class="metric"><span>Edge</span><b class="green">${edge(r.consensus_ev)}</b></div></div><div class="meta">Modelo ${fmt(r.expected)} · línea ${fmt(r.line,1)} · justa ${fmt(r.fair)} · ${r.books} casas · mejor ${fmt(r.best_odd)} ${r.best_book}</div></article>`}
function renderCard(){let h='<div class="section">Jugadas calificadas</div>';h+=D.straights.length?D.straights.map(pickCard).join(''):'<div class="empty">Ningún mercado cumplió todos los filtros. No bet también es una decisión.</div>';$('card').innerHTML=h}
function renderParlays(){let h='<div class="section">Máximo dos legs · juegos distintos</div>';if(!D.parlays.length)h+='<div class="empty">No hay combinación 2-leg entre 1.60 y 1.80 con ambas piernas por encima de 75%.</div>';D.parlays.forEach((p,i)=>{h+=`<article class="card pick"><div class="head"><div><div class="scope">Parlay ${i+1} · referencia</div><div class="market">Dos mercados de alta probabilidad</div></div><span class="badge">${fmt(p.price)}</span></div>${p.legs.map(x=>`<div class="leg"><b>${x.market}</b><div class="meta">${x.away} @ ${x.home} · ${pct(x.probability)} · cuota ${fmt(x.median_odd)}</div></div>`).join('')}<div class="meta">Probabilidad conjunta ${pct(p.probability)} · justa ${fmt(p.fair)} · edge ${edge(p.edge)}. Verifica precio final en tu casa.</div></article>`});$('parlays').innerHTML=h}
function renderSlate(){let h='<div class="section">Proyección por promedios de equipo</div>';h+=D.projections.map(g=>`<article class="card"><div class="scope">${g.kickoff} ET · ID ${g.game_id}</div><div class="projection"><div class="team">${g.away}<div>${fmt(g.away_points,1)}</div></div><div class="score">${fmt(g.total,1)}</div><div class="team">${g.home}<div>${fmt(g.home_points,1)}</div></div></div><div class="meta">Lean ${g.lean} por ${fmt(g.margin,1)} · total proyectado al centro</div></article>`).join('');$('slate').innerHTML=h}
function renderGrade(){const g=D.grade;let h=`<div class="section">Última tarjeta · ${g.game}</div><article class="card"><div class="head"><div><div class="scope">Resultado final</div><div class="market">${g.result}</div></div><div class="rank ${g.straight_units>=0?'green':'red'}">${g.straight_record}</div></div><div class="meta">Straights: ${g.straight_units>=0?'+':''}${fmt(g.straight_units)} unidades</div></article>`;h+=`<article class="card">${g.picks.map(x=>`<div class="grade"><span>${x.name}<small class="meta"> · ${x.actual}</small></span><b class="${x.result==='WIN'?'green':'red'}">${x.result}</b></div>`).join('')}</article><article class="card"><div class="scope">Ajuste aplicado</div><p class="note">${g.adjustment}</p></article>`;$('grade').innerHTML=h}
function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x.dataset.view===id));scrollTo(0,0)}
document.querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>show(x.dataset.view));$('date').textContent=D.meta.date;$('rules').textContent=D.meta.rules;$('screen').textContent=D.meta.exclusion_note||'';$('games').textContent=D.meta.games;$('straightCount').textContent=D.straights.length;$('parlayCount').textContent=D.parlays.length;renderCard();renderParlays();renderSlate();renderGrade();
</script>
</body>
</html>
