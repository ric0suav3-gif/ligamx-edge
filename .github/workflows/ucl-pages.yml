name: Deploy UCL Edge Mobile

on:
  push:
    branches: ["ucl-edge-v1"]
    paths:
      - "UCL_Edge_iPhone.html"
      - ".github/workflows/ucl-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UCL branch
        uses: actions/checkout@v4

      - name: Build Pages artifact
        run: |
          mkdir -p _site
          cp UCL_Edge_iPhone.html _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
