function renderH2H(f){var out="";for(var k in S){var x=f.stats[k],m=h2h(x[0],x[1],R[k]);out+='<div class="card"><div class="head"><div><div class="title">H2H · '+S[k]+'</div><span class="rel '+x[2]+'">'+x[2]+'</span></div><div class="meta">'+x[0].toFixed(2)+' vs '+x[1].toFixed(2)+'</div></div><div class="h3"><div class="big home"><div class="lab">'+f.home+'</div><div class="px">'+fmt(m.hf)+'</div><div class="pc">'+pct(m.hp)+'</div></div><div class="big"><div class="lab">Empate</div><div class="px">'+pct(m.t)+'</div><div class="pc">push</div></div><div class="big away"><div class="lab">'+f.away+'</div><div class="px">'+fmt(m.af)+'</div><div class="pc">'+pct(m.ap)+'</div></div></div></div>'}return out}
function renderAH(f){var out="";for(var k in S){var x=f.stats[k],r=R[k],diff=x[0]-x[1],c=Math.round(-diff*2)/2,rows="";for(var d=-1;d<=1;d+=.5){var line=c+d,m=ah(x[0],x[1],r,line);rows+='<div class="grid3" style="grid-template-columns:70px 1fr"><div class="line">'+(line>0?"+":"")+line.toFixed(1)+'</div><div class="odd"><div class="lab">'+f.home+' AH</div><div class="px">'+fmt(m.fair)+'</div><div class="pc">push '+pct(m.push)+'</div></div></div>'}out+='<div class="card"><div class="head"><div><div class="title">AH · '+S[k]+'</div><span class="rel '+x[2]+'">'+x[2]+'</span></div><div class="meta">dif '+diff.toFixed(2)+'</div></div>'+rows+'</div>'}return out}
function pickCard(e){var f=F.find(function(x){return x.id===e[0]}),l=level(e[8]),team=e[2]==="home"?f.home:f.away,sel=e[3]==="under"?"U":"O";return '<div class="pick '+l+'"><div class="picktop"><div class="pickname">'+team+' '+sel+e[4]+' '+S[e[1]]+'<br><span style="font-size:.6rem;color:var(--muted);font-weight:650">'+f.home+' vs '+f.away+'</span></div><div class="ev">+'+(e[8]*100).toFixed(1)+'%</div></div><div class="prices"><div class="pbox"><div class="k">Modelo fair</div><div class="v">'+e[5].toFixed(2)+'</div></div><div class="pbox"><div class="k">Mediana</div><div class="v">'+e[6].toFixed(2)+'</div></div><div class="pbox"><div class="k">Mejor</div><div class="v">'+e[9].toFixed(2)+'</div></div></div><div class="pickmeta">'+e[7]+' books · mejor '+e[10]+'</div></div>'}
function renderPicks(f,global){var arr=global?E.slice():E.filter(function(e){return e[0]===f.id});arr.sort(function(a,b){return b[8]-a[8]});var out='<div class="section"><h3>'+(global?"Top edges del día":"Edges de este partido")+'</h3><span>safe mode · ≥2 books</span></div>';if(!arr.length)return out+'<div class="empty">No hay team totals ≥5% de edge para este partido en safe mode.</div>';for(var i=0;i<arr.length;i++)out+=pickCard(arr[i]);return out}
function renderGoals(){return '<div class="empty"><b style="color:var(--text)">Goles temporalmente bloqueado</b><br><br>La interfaz está lista, pero el módulo de goles anterior quedó fuera después de detectar una transferencia cross-league demasiado agresiva. Se activará cuando el goal model esté recalibrado y walk-forward validado.</div>'}
function updateWarn(f){var w=document.getElementById("warn"),low=0;for(var k in f.stats)if(f.stats[k][2]==="LOW")low++;if(globalPicks){w.innerHTML='<div class="warn safe">✓ PICKS GLOBALES: solo team totals safe-mode con consenso de al menos 2 casas.</div>';return}if(mode==="team"||mode==="picks")w.innerHTML='<div class="warn safe">✓ SAFE MODE: team totals univariados. Los badges muestran edge vs mediana de mercado.</div>';else if(mode==="goals")w.innerHTML='<div class="warn exp">⚠ Goles: pendiente de recalibración.</div>';else w.innerHTML='<div class="warn exp">⚠ EXPERIMENTAL: este módulo combina conteos de ambos equipos y todavía asume independencia.</div>';if(low)w.innerHTML+='<div class="warn low">Confianza LOW en '+low+' de 6 familias para este partido.</div>'}
function render(){var f=fixture();document.getElementById("hn").textContent=f.home;document.getElementById("an").textContent=f.away;document.getElementById("kick").textContent=f.kick+' · fixture '+f.id;updateWarn(f);var html="";if(globalPicks)html=renderPicks(f,true);else if(mode==="team")html=renderTeam(f);else if(mode==="h2h")html=renderH2H(f);else if(mode==="goals")html=renderGoals();else if(mode==="ah")html=renderAH(f);else if(mode==="picks")html=renderPicks(f,false);else html=renderTotal(f);document.getElementById("content").innerHTML=html}
function init(){var s=document.getElementById("fixtureSel");for(var i=0;i<F.length;i++){var o=document.createElement("option");o.value=F[i].id;o.textContent=F[i].home+" vs "+F[i].away;s.appendChild(o)}s.onchange=function(){globalPicks=false;render()};document.querySelectorAll(".tab").forEach(function(t){t.onclick=function(){globalPicks=false;document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on")});t.classList.add("on");mode=t.dataset.mode;render()}});document.getElementById("navMarkets").onclick=function(){globalPicks=false;this.classList.add("on");document.getElementById("navPicks").classList.remove("on");render()};document.getElementById("navPicks").onclick=function(){globalPicks=true;this.classList.add("on");document.getElementById("navMarkets").classList.remove("on");render()};render()}
init();
</script>
</body>
